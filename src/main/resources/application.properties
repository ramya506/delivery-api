spring.application.name=delivery-api

# Cloud Run injects PORT; locally it falls back to 8080
server.port=${PORT:8080}

# In-memory H2 database, re-seeded on every start (deterministic data)
spring.datasource.url=jdbc:h2:mem:deliverydb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}

# How many delivery rows to generate on startup
app.seed.rows=${SEED_ROWS:120000}

# Comma-separated list of allowed frontend origins (CORS)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Assumed cost (INR) of one extra delivery attempt
app.reattempt-cost=${REATTEMPT_COST:60}

management.endpoints.web.exposure.include=health
